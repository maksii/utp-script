  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: stripcyrillicletters
    type: checkbox
    label: "Strip Cyrillic letters and rebuild video titles"
    default: true
  - name: appendreleasegroup
    type: checkbox
    label: "Append release group (uploader) to the title"
    default: true
  - name: normalizequality
    type: checkbox
    label: "Normalize quality/source names (BDRemux -> BluRay Remux, BDRip -> BluRay, ...)"
    default: true
  - name: freeleechonly
    type: checkbox
    label: "Show freeleech-only results"
    default: false
  - name: info_limits
    type: info
    label: "About this indexer"
    default: "An alternative Cardigann (YAML) indexer for Toloka with title-formatting enhancements: video forums are rebuilt into a Sonarr/Radarr-parseable shape (series name, SxxExx incl. ranges/counts, year, source/codec, edition, audio-language tag, release group) while music/books/etc. pass through unchanged. A Cardigann definition makes ONE request per search, so per-result detail-page data is unavailable: magnet links, resolution from MediaInfo, grab counts and IMDb/poster/file-count. See README.md."

login:
  path: login.php
  method: post
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
    autologin: "on"
    ssl: "on"
    redirect: ""
    login: "Вхід"
  test:
    path: tracker.php
    selector: a[href*="logout=true"]

search:
  paths:
    - path: tracker.php
    - path: tracker.php
      inputs:
        start: 50
  inputs:
    $raw: "{{ range .Categories }}f[]={{.}}&{{end}}{{ if .Config.freeleechonly }}sds=1&{{ else }}{{ end }}"
    nm: "{{ .Keywords }}"
    o: 1
    s: 2

  keywordsfilters:
    - name: re_replace
      args: ["(?i)\\bS0*(\\d+)(?:E0*\\d+)?\\b", "Сезон $1"]

  rows:
    selector: table.forumline tr[class*="prow"]

  fields:
    # raw forum id (UNMAPPED) — the per-category gate keys on this.
    forum:
      selector: td.gen a
      attribute: href
      filters:
        - {name: querystring, args: f}
    category:
      selector: td.gen a
      attribute: href
      filters:
        - {name: querystring, args: f}
    # _isvideo = 1 for the 48 reconstructable Movies/TV/Anime forums (sport + non-video excluded).
    _isvideo:
      text: "{{ .Result.forum }}"
      filters:
        - {name: re_replace, args: ["^(16|18|19|21|32|42|44|45|55|66|70|72|84|94|96|117|118|119|120|124|125|127|129|131|132|136|137|138|139|140|144|173|174|190|192|193|194|195|196|197|219|225|226|227|228|229|230|237)$", "1"]}
        - {name: re_replace, args: ["^(?!1$).*$", ""]}
    # _subsonly = 1 for the Ukrainian-subtitles tree (original-audio default).
    _subsonly:
      text: "{{ .Result.forum }}"
      filters:
        - {name: re_replace, args: ["^(190|70|192|193|195|194|196|197)$", "1"]}
        - {name: re_replace, args: ["^(?!1$).*$", ""]}
    # _dorebuild = 1 only when StripCyrillicLetters is on AND this is a video forum. When the user turns the
    # toggle off, this is empty for EVERY row, so the title gate routes video through the honest pass-through too
    # (mirrors the C#: strip=off keeps the original multi-language title instead of rebuilding it).
    _dorebuild:
      text: "{{ if .Config.stripcyrillicletters }}{{ .Result._isvideo }}{{ else }}{{ end }}"
    # uploader -> transliterated release group (ASCII handles verbatim; spaces -> _; Anonymous kept).
    uploader:
      selector: "td:nth-child(4)"
      filters:
        - {name: trim}
        - {name: re_replace, args: ["(?i)^(Anonymous|Анонім)$", "Anonymous"]}
        - {name: replace, args: ["щ", "shch"]}
        - {name: replace, args: ["ж", "zh"]}
