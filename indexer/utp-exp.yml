---
id: utopia-exp
name: UTOPIA (API)-experimental
description: "UTOPIA is a UKRAINIAN Private Tracker for HD MOVIES and TV"
language: uk-UA
type: private
encoding: UTF-8
links:
  - https://utp.to/

caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: "Movies"}
    - {id: 2, cat: TV, desc: "TV"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid, tvdbid, tmdbid]
    movie-search: [q, imdbid, tmdbid]

settings:
  - name: apikey
    type: text
    label: APIKey
  - name: info_key
    type: info
    label: About your API key
    default: "Find or Generate a new API Token by accessing your <a href=\"https://utp.to/\" target=\"_blank\">UTOPIA</a> account <i>My Settings</i> page and clicking on the <b>API Key</b> tab."
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false

  - name: single_file_release_use_filename
    type: checkbox
    label: Use filename as title for single-file releases
    default: false
  - name: info_single_file_release_use_filename
    type: info
    label: Use filename as title for single-file releases
    default: "<b>Not recommended.</b> For releases that contain a single file, use that file's name as the title instead of the torrent name. Most filenames on the site do not follow a strict naming convention, whereas the release (torrent) name usually does — so enabling this often produces worse titles for Sonarr/Radarr to parse. Leave off unless you know the filenames are well-formed."

  - name: add_ukrainian_to_title
    type: checkbox
    label: Add UKR tag after the resolution
    default: false
  - name: info_add_ukrainian_to_title
    type: info
    label: Add UKR tag after the resolution
    default: "Inserts a <b>UKR</b> tag right after the resolution (e.g. <i>1080p UKR</i>) so Sonarr and Radarr detect Ukrainian as a release language."

  - name: use_mediainfo_audio_languages
    type: checkbox
    label: Add audio languages from MediaInfo to titles
    default: true
  - name: info_use_mediainfo_audio_languages
    type: info
    label: Add audio languages from MediaInfo to titles
    default: "Parses each audio track's language from the torrent's MediaInfo and appends it after the resolution (e.g. <i>1080p [Ukrainian+English]</i>) to improve language detection by Sonarr and Radarr."

  - name: use_mediainfo_subtitle_languages
    type: checkbox
    label: Add subtitle languages from MediaInfo to titles
    default: true
  - name: info_use_mediainfo_subtitle_languages
    type: info
    label: Add subtitle languages from MediaInfo to titles
    default: "Parses each subtitle track's language from MediaInfo and appends it tagged as <b>Subs</b> (e.g. <i>[Subs English]</i>). <b>WARNING:</b> this requires custom formats in Sonarr/Radarr that recognise the Subs tag. Without them the subtitle languages are read as audio/release languages and cause false-positive language detection."

  - name: add_releasegroup_by_uploader
    type: checkbox
    label: Use uploader as release group when none present
    default: true
  - name: info_add_releasegroup_by_uploader
    type: info
    label: Use uploader as release group when none present
    default: "When a release has no release group, appends the uploader's name as the group (e.g. <i>Title 1080p-Uploader</i>) to improve custom-format and release-group detection by Sonarr and Radarr."

  - name: fix_tv_year
    type: checkbox
    label: Replace TV year with first-season year
    default: true
  - name: info_fix_tv_year
    type: info
    label: Replace TV year with first-season year
    default: "For TV releases, replaces a year adjacent to the season tag with the year of the show's first season (e.g. <i>S01 2021</i> → <i>2019 S01</i>). Years that are part of the show's name (e.g. <i>1923</i>) are left untouched."

  - name: normalize_bluray_source_tags
    type: checkbox
    label: Normalize Blu-ray source tags
    default: true
  - name: info_normalize_bluray_source_tags
    type: info
    label: Normalize Blu-ray source tags
    default: "Renames <b>BDRemux</b> → <i>BluRay REMUX</i> and <b>BDRip</b> → <i>BluRay</i> so Sonarr and Radarr detect the source correctly."
  - name: sort
    type: select
    label: Sort requested from site
    default: created_at
    options:
      created_at: created
      seeders: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc
  - name: info_activity
    type: info
    label: Account Inactivity
    default: "If you stop visiting the site or downloading torrents your account will be automatically deactivated after 180 days."

login:
  path: api/torrents
  method: get
  inputs: {} # TODO: remove in v10
  error:
    - selector: a[href*="/login"]
      message:
        text: "The API key was not accepted by {{ .Config.sitelink }}."
    - selector: :root:contains("Account is Banned")

search:
  paths:
    # https://hdinnovations.github.io/UNIT3D/torrent_api.html
    # https://github.com/HDInnovations/UNIT3D/blob/master/app/Http/Controllers/API/TorrentController.php#L657
    - path: api/torrents/filter
      response:
        type: json

  headers:
    Authorization: ["Bearer {{ .Config.apikey }}"]

  inputs:
  # if we have an id based search, add Season and Episode as query in name for UNIT3D < v6.  Else pass S/E Params for UNIT3D >= v6
    $raw: "{{ range .Categories }}&categories[]={{.}}{{end}}"
    name: "{{ .Keywords }}"
    seasonNumber: "{{ .Query.Season }}"
    episodeNumber: "{{ .Query.Ep }}"
    imdbId: "{{ .Query.IMDBIDShort }}"
    tmdbId: "{{ .Query.TMDBID }}"
    tvdbId: "{{ .Query.TVDBID }}"
    "free[]": "{{ if .Config.freeleech }}100{{ else }}{{ end }}"
    sortField: "{{ .Config.sort }}"
    sortDirection: "{{ .Config.type }}"
    perPage: 100

  keywordsfilters:
    - name: re_replace
      args: ["\\.", " "]

  rows:
    selector: data
    attribute: attributes

  fields:
    category:
      selector: category_id
    title_optional:
      selector: name
    title_filename:
      selector: "files[0].name"
      optional: true
    files:
      selector: num_file
    uploader:
      selector: uploader
      optional: true
    release_year:
      selector: release_year
      optional: true
    category_name:
      selector: category
    mediainfo:
      selector: media_info
      optional: true
    audio_languages:
      text: "{{ .Result.mediainfo }}"
      filters:
        - name: re_replace
          args: ["(?s).*?Audio(?:\\s+#\\d+)?\\r?\\n(?:(?!\\r?\\n\\r?\\n).)*?Language\\s+:\\s+([^\\r\\n|]+?)\\s*(?=[|\\r\\n]|$)", "[$1]"] # Extract each audio track language. Capture stops at the first '|' (and trims), so a Language field padded with codec/bitrate junk (eg "Ukrainian | E-AC-3 | 640kb/s | DUB | Le Doyen") yields just "Ukrainian". The blank-line guard keeps an untagged track from borrowing a later/subtitle language
        - name: re_replace
          args: ["^((?:\\[[^\\[\\]]*\\])*)[\\s\\S]*$", "$1"] # Keep only the leading run of [language] tags; drop the rest of the mediainfo dump (robust to unbalanced brackets)
        - name: re_replace
          args: ["(?<=\\[[^\\]]*)\\s\\([^)]+\\)", ""] # Remove region/variant in parens inside a tag, eg [English (GB)] -> [English]
        - name: re_replace
          args: ["\\[(.*?)\\](?=.*\\[\\1\\])", ""] # Remove any duplicate language tags, eg [Ukrainian][Ukrainian] -> [Ukrainian]
        - name: re_replace
          args: ["\\]\\[", "+"] # Replace ][ with a +, eg [Ukrainian][English] -> [Ukrainian+English]
    subtitle_languages:
      text: "{{ .Result.mediainfo }}"
      filters:
        - name: re_replace
          args: ["(?s).*?Text(?:\\s+#\\d+)?\\r?\\n(?:(?!\\r?\\n\\r?\\n).)*?Language\\s+:\\s+([^\\r\\n|]+?)\\s*(?=[|\\r\\n]|$)", "[$1]"] # Extract each subtitle track language. Capture stops at the first '|' (and trims), same junk-tolerance as audio above; blank-line guard stops cross-section bleed
        - name: re_replace
          args: ["^((?:\\[[^\\[\\]]*\\])*)[\\s\\S]*$", "$1"] # Keep only the leading run of [language] tags; drop the rest of the mediainfo dump (robust to unbalanced brackets)
        - name: re_replace
          args: ["(?<=\\[[^\\]]*)\\s\\([^)]+\\)", ""] # Remove region/variant in parens inside a tag, eg [Chinese (Simplified)] -> [Chinese]
        - name: re_replace
          args: ["\\[(.*?)\\](?=.*\\[\\1\\])", ""] # Remove any duplicate language tags
        - name: re_replace
          args: ["\\]\\[", "+"] # Replace ][ with a +
        - name: re_replace
          args: ["\\[", "[Subs "] # Replace [ with [Subs, eg [English+Ukrainian] -> [Subs English+Ukrainian]
    title:
      text: "{{ if and (.Config.single_file_release_use_filename) (eq .Result.files \"1\") (.Result.title_filename) }}{{ .Result.title_filename }}{{ else }}{{ .Result.title_optional }}{{ end }}"
      filters:
        - name: re_replace
          args: ["(.*?\\b(?:4320p|2160p|1440p|1080[pi]|720p|576[pi]|480[pi])\\b)(.*)", "{{ if .Config.add_ukrainian_to_title }}$1 UKR$2{{ else }}$1$2{{ end }}"] # Add UKR tag after the resolution
        - name: re_replace
          args: ["^(?!\\s*\\[[^\\]]+\\]\\s*)(?!.*(?:-[^-\\s.]+[-\\s.]*$|\\s*\\[[^\\]]+\\]\\s*$))(.+)", "{{ if and .Config.add_releasegroup_by_uploader .Result.uploader }}$1-{{ .Result.uploader }}{{ else }}$1{{ end }}"] # Append uploader as release group only when none present. The group token excludes dots (so dotted names like WEB-DL.x264 still qualify), and a trailing run of separators is tolerated so a dangling '-' after the group (eg ...1080p-dK-) is still recognised as a group and not double-tagged with the uploader
        # Insert parsed MediaInfo languages after the resolution, each gated independently. NOTE: Prowlarr's {{ if }}
        # regex REQUIRES an {{ else }} branch - an {{ if }}..{{ end }} with no {{ else }} is left in the output verbatim
        # (only the separate {{ .Result.x }} substitution pass runs on it). So every conditional below uses the
        # {{ if .. }}..{{ else }}..{{ end }} form. (This is why the per-language gating lives here in two filters rather
        # than as {{ if }} blocks inside a combined language_tags text: field, where the missing else leaked literally.)
        - name: re_replace
          args: ["(.*?\\b(?:4320p|2160p|1440p|1080[pi]|720p|576[pi]|480[pi])\\b)(.*)", "{{ if and .Config.use_mediainfo_subtitle_languages .Result.subtitle_languages }}$1 {{ .Result.subtitle_languages }}$2{{ else }}$1$2{{ end }}"] # Subtitle languages - inserted first so the audio tag (next filter) lands ahead of it
        - name: re_replace
          args: ["(.*?\\b(?:4320p|2160p|1440p|1080[pi]|720p|576[pi]|480[pi])\\b)(.*)", "{{ if and .Config.use_mediainfo_audio_languages .Result.audio_languages }}$1 {{ .Result.audio_languages }}$2{{ else }}$1$2{{ end }}"] # Audio languages
        - name: re_replace
          args: ["(S\\d+(?:E\\d+)*)(\\s+)((?:19|20)\\d{2}(?:-(?:19|20)\\d{2})?)\\b", "{{ if and (.Config.fix_tv_year) (eq .Result.category_name \"TV\") (.Result.release_year) }}{{ .Result.release_year }}$2$1{{ else }}$1$2$3{{ end }}"] # TV: a year right AFTER the season is the season-year - move the first-season year before the season (S01 2021 -> 2019 S01). Only a year adjacent to the season is touched, so a year-named show (1923, 2049) is never clobbered
        - name: re_replace
          args: ["(?<=\\S\\s)((?:19|20)\\d{2}(?:-(?:19|20)\\d{2})?)(\\s+S\\d+(?:E\\d+)*)\\b", "{{ if and (.Config.fix_tv_year) (eq .Result.category_name \"TV\") (.Result.release_year) }}{{ .Result.release_year }}$2{{ else }}$1$2{{ end }}"] # TV: a year just BEFORE the season (and not the first title token) -> normalise to first-season year in place; the lookbehind keeps a leading year-name like 1923 untouched
        - name: re_replace
          args: ["BDRemux", "{{ if .Config.normalize_bluray_source_tags }}BluRay REMUX{{ else }}BDRemux{{ end }}"] # Gated source-tag rename; the {{ else }} keeps it a no-op (not a verbatim leak) when the toggle is off
        - name: re_replace
          args: ["BDRip", "{{ if .Config.normalize_bluray_source_tags }}BluRay{{ else }}BDRip{{ end }}"] # Gated source-tag rename
        - name: re_replace
          args: ["\\s{2,}", " "] # Collapse any double spaces created by the inserts above
        - name: re_replace
          args: ["^\\s+|[\\s-]+$", ""] # Trim leading whitespace and any trailing whitespace/dangling separators (eg a stray '-' left at the end by a malformed release name)
    details:
      selector: details_link
    download:
      selector: download_link
    infohash:
      # NOTE: UNIT3D CE >= 9.x no longer returns info_hash (only inside magnet_link). optional:true is
      # REQUIRED - a null non-optional field aborts the whole JSON search. Harmless/empty if absent.
      selector: info_hash
      optional: true
    poster:
      selector: meta.poster
      filters:
        - name: replace
          args: ["https://via.placeholder.com/90x135", ""]
    # external-db ids can be null for un-matched torrents; optional:true keeps the row
    # instead of aborting the whole JSON search on a null value.
    imdbid:
      selector: imdb_id
      optional: true
    tmdbid:
      selector: tmdb_id
      optional: true
    tvdbid:
      selector: tvdb_id
      optional: true
    genre:
      selector: meta.genres
      filters:
        - name: re_replace
          args: ["(?i)(Екшн і Пригоди)", "Екшн_і_Пригоди"]
        - name: re_replace
          args: ["(?i)(Мильна опера)", "Мильна_опера"]
        - name: re_replace
          args: ["(?i)(Науково фантастичний)", "Науково_фантастичний"]
        - name: re_replace
          args: ["(?i)(Політика та війна)", "Політика_та_війна"]
    _internal:
      selector: internal
      case:
        False: "{{ .False }}"
        True: "{{ .True }}"
    description:
      text: "{{ if .Result._internal }}Internal{{ else }}{{ end }}{{ if and .Result._internal .Result.genre }} | {{ else }}{{ end }}{{ .Result.genre }}"
    seeders:
      selector: seeders
    leechers:
      selector: leechers
    grabs:
      selector: times_completed
    date:
      # "created_at": "2021-10-18T00:34:50.000000Z" is returned by Newtonsoft.Json.Linq as 10/18/2021 00:34:50 (MM/dd/yyyy, InvariantCulture)
      selector: created_at
      filters:
        - name: append
          args: " +00:00" # GMT
        - name: dateparse
          args: "MM/dd/yyyy HH:mm:ss zzz"
    size:
      selector: size
    _featured:
      selector: featured
      case:
        False: "{{ .False }}"
        True: "{{ .True }}"
    downloadvolumefactor_freeleech:
      # api returns 0%, 25%, 50%, 75%, 100%
      selector: freeleech
      case:
        0%: 1 # not free
        25%: 0.75
        50%: 0.5
        75%: 0.25
        100%: 0 # freeleech
        "*": 0 # catch errors
    downloadvolumefactor:
      text: "{{ if .Result._featured }}0{{ else }}{{ .Result.downloadvolumefactor_freeleech }}{{ end }}"
    uploadvolumefactor_double_upload:
      # api returns False, True
      selector: double_upload
      case:
        False: 1 # normal
        True: 2 # double
    uploadvolumefactor:
      text: "{{ if .Result._featured }}2{{ else }}{{ .Result.uploadvolumefactor_double_upload }}{{ end }}"
# global MR is 0.4 but torrents must be seeded for 3 days regardless of ratio
#    minimumratio:
#      text: 0.4
    minimumseedtime:
      # 3 days (as seconds = 3 x 24 x 60 x 60)
      text: 259200
# json UNIT3D 9.2.0
